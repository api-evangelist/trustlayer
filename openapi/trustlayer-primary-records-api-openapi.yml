  /primary-records/{id}/request-records/{recordId}/compliance-certificate:
    get:
      tags:
      - Primary Records
      description: Get compliance certificate for a request record in a primary record
      parameters:
      - schema:
          type: string
          minLength: 1
        in: query
        name: fields
        required: false
        description: 'Comma-separated list of fields to project. Allowed: _id, name, processing, url, flag, organization, reviewedAt, archivedAt, notes, status, expirationDate, appliesToAllProjects, data, metadata, issueDate, createdAt, updatedAt'
      - schema:
          $ref: '#/components/schemas/objectIdInput'
        in: path
        name: id
        required: true
      - schema:
          $ref: '#/components/schemas/objectIdInput'
        in: path
        name: recordId
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    description: Unique identifier of the document.
                    allOf:
                    - $ref: '#/components/schemas/objectId'
                  name:
                    type: string
                    description: Human-readable name of the document, derived from its source.
                  processing:
                    nullable: true
                    description: Whether the document is still being processed (data extraction, classification). When `true`, extracted fields may not yet be populated.
                    type: boolean
                  url:
                    description: Signed URL to download the document file. Time-limited; regenerated on each read.
                    nullable: true
                    type: string
                  flag:
                    nullable: true
                    description: Compliance flag attached to the document, if any. `null` when the document is not flagged.
                    type: object
                    properties:
                      addedOn:
                        nullable: true
                        description: Timestamp at which the flag was added to the document.
                        type: string
                        format: date-time
                      level:
                        nullable: true
                        description: Severity of the flag (e.g. warning, error).
                        type: string
                      subjects:
                        nullable: true
                        description: Compliance subjects affected by this flag.
                        type: array
                        items: {}
                      notes:
                        nullable: true
                        description: Free-form notes attached to the flag.
                        type: string
                    required:
                    - addedOn
                    - level
                    - subjects
                    - notes
                    additionalProperties: false
                  organization:
                    description: Identifier of the organization (workspace) that owns the document. Always equal to the caller's organization.
                    allOf:
                    - $ref: '#/components/schemas/objectId'
                  reviewedAt:
                    nullable: true
                    description: Timestamp at which the document was reviewed, if it has been reviewed.
                    type: string
                    format: date-time
                  archivedAt:
                    nullable: true
                    description: Timestamp at which the document was archived, if archived. `null` for active documents.
                    type: string
                    format: date-time
                  notes:
                    nullable: true
                    description: Free-form notes attached to the document.
                    type: string
                  status:
                    nullable: true
                    description: Lifecycle status of the document.
                    type: string
                  expirationDate:
                    nullable: true
                    description: Expiration date extracted from the document, if applicable.
                    type: string
                    format: date-time
                  appliesToAllProjects:
                    nullable: true
                    description: Whether the document applies to all projects (context records) for the owning primary record, rather than a specific one.
                    type: boolean
                  data:
                    description: Structured data extracted from the document during processing.
                    nullable: true
                  metadata:
                    description: Document metadata (e.g. originating upload source, file properties).
                    nullable: true
                  issueDate:
                    nullable: true
                    description: Issue date extracted from the document, if applicable.
                    type: string
                    format: date-time
                  createdAt:
                    description: Timestamp at which the document was created.
                    type: string
                    format: date-time
                  updatedAt:
                    description: Timestamp at which the document was last updated.
                    type: string
                    format: date-time
