  /primary-records/{id}/request-records/{recordId}:
    get:
      tags:
      - Primary Records
      description: Read a single request record scoped to a specific primary record. Returns 404 if the request record does not exist or does not belong to the specified primary record.
      parameters:
      - schema:
          type: string
          minLength: 1
        in: query
        name: fields
        required: false
        description: 'Comma-separated list of fields to project. Allowed: _id, organization, primaryRecordId, contextRecordId, name, status, complianceTracking, complianceProfile, complianceStatus, createdAt, updatedAt, complianceModules'
      - schema:
          allOf:
          - $ref: '#/components/schemas/objectIdInput'
        in: path
        name: id
        required: true
        description: Identifier of the primary record.
      - schema:
          allOf:
          - $ref: '#/components/schemas/objectIdInput'
        in: path
        name: recordId
        required: true
        description: Identifier of the request record to read.
