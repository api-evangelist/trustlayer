        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Human-readable singular name of the context object type (e.g. "Project").
                pluralName:
                  type: string
                  minLength: 1
                  description: Human-readable plural name of the context object type (e.g. "Projects").
                icon:
                  default: shop
                  description: Icon identifier shown in the UI for context records of this type. Defaults to `shop`.
                  type: string
                  minLength: 1
              required:
              - name
              - pluralName
              description: Request body for creating a context object (context type) in the caller's organization. The owning organization is always derived from the caller's token and cannot be set here.
        description: Request body for creating a context object (context type) in the caller's organization. The owning organization is always derived from the caller's token and cannot be set here.
