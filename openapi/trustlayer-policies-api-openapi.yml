  /policies/{number}/cancellations/{id}:
    delete:
      tags:
      - Policies
      description: Delete a previously-applied policy cancellation. Removing the cancellation reverses its effect on subject validity, so any subjects it was suppressing become valid again subject to the policy's other modifiers.
      parameters:
      - schema:
          type: string
          minLength: 1
        in: path
        name: number
        required: true
        description: Policy number identifying the policy from which the cancellation should be removed.
      - schema:
          allOf:
          - $ref: '#/components/schemas/objectIdInput'
        in: path
        name: id
