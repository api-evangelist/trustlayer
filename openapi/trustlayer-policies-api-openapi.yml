      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentId:
                  description: Identifier of the cancellation notice document attached to this cancellation.
                  allOf:
                  - $ref: '#/components/schemas/objectIdInput'
                subjectCodes:
                  description: Subject codes from the cancellation notice. When omitted the cancellation is treated as blanket and applies to all subjects on the policy.
                  type: array
                  items:
                    type: string
                    minLength: 1
                effectiveDate:
                  description: Date on which the cancellation takes effect, as reported on the notice.
                issueDate:
                  description: Date the cancellation notice was issued. Optional; include when available from the notice.
                notes:
                  description: Free-form notes about the cancellation.
                  type: string
                  minLength: 1
              required:
              - documentId
              - effectiveDate
              description: Request body for creating a policy cancellation. Applying a cancellation updates subject validity statuses immediately.
