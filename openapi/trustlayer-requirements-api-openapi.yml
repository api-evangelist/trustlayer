      description: Create a library requirement in the caller's organization (derived from the access token). Define the module/subject by label to create new ones, or by code/label to reuse an existing template, plus the attribute definition. Returns the persisted requirement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - allOf:
                - type: object
                  properties:
                    subjectCode:
                      type: string
                      minLength: 1
                      description: Existing subject code on the compliance profile. When provided, the subject (and its parent module) are reused. Mutually exclusive with `subjectLabel`.
                    moduleCode:
                      description: Existing module code on the compliance profile. When provided, the requirement is anchored to that module. Mutually exclusive with `moduleLabel`.
                      type: string
                      minLength: 1
                    subjectLabel:
                      not: {}
                    moduleLabel:
                      not: {}
                    matchingCriteria:
                      type: string
                      enum:
                      - matchOnce
                      - matchRepeatedly
                      description: How the requirement matches against documents (e.g. `MatchOnce`, `MatchRepeatedly`).
                    attributeCode:
                      not: {}
                  required:
                  - subjectCode
                  - matchingCriteria
                - type: object
                  properties:
                    attributeCode:
                      type: string
                      minLength: 1
                    attributeLabel:
                      type: string
                      minLength: 1
                    attributeDescription:
                      type: string
                      minLength: 1
                  required:
                  - attributeLabel
                - oneOf:
                  - type: object
                    properties:
                      attributeType:
                        type: string
                        enum:
                        - number
                        - amBestRating
                        - amBestFinancialStrength
                      operator:
                        type: string
                        enum:
                        - must be greater or equal to
                        - must be less than or equal to
                      targetValue:
                        type: string
                        minLength: 1
                    required:
                    - attributeType
                    - operator
                    - targetValue
                  - type: object
                    properties:
                      attributeType:
                        type: string
                        enum:
                        - boolean
                        - connected
                        - ai
                      operator:
                        type: string
                        enum:
                        - must be present
                      targetValue:
                        not: {}
                    required:
                    - attributeType
                    - operator
                  - type: object
                    properties:
                      attributeType:
                        type: string
                        enum:
                        - fillableForm
                      operator:
                        type: string
                        enum:
                        - must be completed by
                      targetValue:
                        type: string
                        minLength: 1
                    required:
                    - attributeType
                    - operator
                    - targetValue
                  - type: object
                    properties:
                      attributeType:
                        type: string
                        enum:
                        - list
                      operator:
                        type: string
                        enum:
                        - at least one must be present from list
                      targetValue:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          minLength: 1
                    required:
                    - attributeType
                    - operator
                    - targetValue
              - allOf:
                - type: object
                  properties:
                    subjectLabel:
                      type: string
                      minLength: 1
                      description: Human-readable label for a new subject. The subject code is derived from this label. Requires `moduleCode` or `moduleLabel` so the new subject can be attached to a module. Mutually exclusive with `subjectCode`.
                    moduleCode:
                      type: string
                      minLength: 1
                      description: Existing module code on the compliance profile. When provided, the requirement is anchored to that module. Mutually exclusive with `moduleLabel`.
                    subjectCode:
                      not: {}
                    moduleLabel:
                      not: {}
                    matchingCriteria:
                      type: string
                      enum:
                      - matchOnce
                      - matchRepeatedly
                      description: How the requirement matches against documents (e.g. `MatchOnce`, `MatchRepeatedly`).
                    attributeCode:
                      not: {}
                  required:
                  - subjectLabel
                  - moduleCode
                  - matchingCriteria
                - type: object
                  properties:
                    attributeCode:
                      type: string
                      minLength: 1
                    attributeLabel:
                      type: string
                      minLength: 1
                    attributeDescription:
                      type: string
                      minLength: 1
                  required:
