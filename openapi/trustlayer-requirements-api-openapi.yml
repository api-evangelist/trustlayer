  /requirements/{id}:
    patch:
      tags:
      - Requirements
      description: Partially update a library requirement in the caller's organization. Supply any subset of the editable fields; omitted fields keep their stored values, and the merged (attributeType, operator, targetValue) triple must be internally consistent. The immutable attributeCode cannot be changed. Triggers the requirement-sync cascade. Returns the updated requirement.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attributeType:
                  description: Data type of the attribute (e.g. boolean, number).
                  type: string
                  enum:
                  - boolean
                  - number
                  - fillableForm
                  - amBestRating
                  - amBestFinancialStrength
                  - connected
                  - list
                  - ai
                attributeLabel:
                  description: Display label of the attribute.
                  type: string
                  minLength: 1
                attributeDescription:
