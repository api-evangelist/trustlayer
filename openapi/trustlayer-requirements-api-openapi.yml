                    - operator
                  - type: object
                    properties:
                      attributeType:
                        type: string
                        enum:
                        - fillableForm
                      operator:
                        type: string
                        enum:
                        - must be completed by
                      targetValue:
                        type: string
                        minLength: 1
                    required:
                    - attributeType
                    - operator
                    - targetValue
                  - type: object
                    properties:
                      attributeType:
                        type: string
                        enum:
                        - list
                      operator:
                        type: string
                        enum:
                        - at least one must be present from list
                      targetValue:
                        minItems: 1
                        type: array
                        items:
                          type: string
                          minLength: 1
                    required:
                    - attributeType
                    - operator
                    - targetValue
              - allOf:
                - type: object
                  properties:
                    subjectLabel:
                      type: string
                      minLength: 1
                      description: Human-readable label for a new subject. The subject code is derived from this label. Requires `moduleCode` or `moduleLabel` so the new subject can be attached to a module. Mutually exclusive with `subjectCode`.
