  /request-records/{id}/compliance-certificate:
    post:
      tags:
      - Request Records
      description: Create a compliance certificate for a request record. Accepts application/json with optional effectiveDate and expirationDate fields, or multipart/form-data with the same date fields plus a document file in the `document` field. Returns the identifier of the created compliance certificate document.
      requestBody:
        required: true
        content:
          application/json: &id001
            schema:
              type: object
              properties:
                effectiveDate:
                  description: ISO date-time for certificate effective date. It will default to today if not provided
                expirationDate:
                  description: ISO date-time for certificate expiration date. It will default to the earliest expiration date found in currently active documents; if no document is present, it will default to 1 year from the effective date
