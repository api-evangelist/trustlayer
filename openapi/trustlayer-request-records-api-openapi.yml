                              operator:
                                type: string
                                enum:
                                - must be present
                              targetValue:
                                not: {}
                            required:
                            - attributeType
                            - operator
                          - type: object
                            properties:
                              attributeType:
                                type: string
                                enum:
                                - fillableForm
                              operator:
                                type: string
                                enum:
                                - must be completed by
                              targetValue:
                                type: string
                                minLength: 1
                            required:
