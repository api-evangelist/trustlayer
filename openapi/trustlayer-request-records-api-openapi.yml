  /request-records/{id}/requirements:
    post:
      tags:
      - Request Records
      description: Add requirements to the request record's compliance profile. Each item is either a library reference (`libraryRequirementId` or `attributeCode`) or a custom definition (module/subject by code or label, attribute by label). Idempotent on the (moduleLabel, subjectLabel, attributeLabel) tuple.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requirements:
                  minItems: 1
                  maxItems: 200
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        libraryRequirementId:
                          description: Identifier of the requirement entry in the workspace's requirements library to clone onto this request record.
                          allOf:
                          - $ref: '#/components/schemas/objectIdInput'
                      required:
                      - libraryRequirementId
                      additionalProperties: false
                      description: Reference an existing library requirement by its identifier. The persisted requirement is a verbatim copy (matchingCriteria, operator, targetValue, attributeType, etc.) of the library entry.
                    - type: object
                      properties:
                        attributeCode:
                          type: string
                          minLength: 1
                          description: Stable code of the library requirement to clone (alternative to `libraryRequirementId`). Must match an entry in the workspace requirements library.
                        matchingCriteria:
                          type: string
                          enum:
                          - matchOnce
                          - matchRepeatedly
                          description: How the requirement matches against documents (e.g. `MatchOnce`, `MatchRepeatedly`). Overrides the library entry value.
                        operator:
                          type: string
                          enum:
                          - must be present
                          - must be greater or equal to
                          - must be less than or equal to
                          - must be completed by
                          - at least one must be present from list
                          description: Comparison operator applied between the document data and `targetValue`. Must be valid for the library entry's `attributeType`.
                        targetValue:
                          description: Value(s) the document data is compared against. String for scalar attribute types; string array for `list` attribute types. Optional for operators that do not require a target value (e.g. `MustBePresent`).
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: array
                            items:
                              type: string
                              minLength: 1
                      required:
                      - attributeCode
                      - matchingCriteria
                      - operator
                      additionalProperties: false
