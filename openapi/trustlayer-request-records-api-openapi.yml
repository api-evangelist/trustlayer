                            properties:
                              attributeType:
                                type: string
                                enum:
                                - number
                                - amBestRating
                                - amBestFinancialStrength
                              operator:
                                type: string
                                enum:
                                - must be greater or equal to
                                - must be less than or equal to
                              targetValue:
                                type: string
                                minLength: 1
                            required:
                            - attributeType
