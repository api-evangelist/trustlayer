    get:
      tags:
      - Request Records
      description: Get the latest non-archived compliance certificate document for a request record. Returns the document with a signed URL when present; returns 404 when no compliance certificate has been generated for the request record.
      parameters:
      - schema:
          type: string
          minLength: 1
        in: query
        name: fields
        required: false
        description: 'Comma-separated list of fields to project. Allowed: _id, name, processing, url, flag, organization, reviewedAt, archivedAt, notes, status, expirationDate, appliesToAllProjects, data, metadata, issueDate, createdAt, updatedAt'
      - schema:
          allOf:
          - $ref: '#/components/schemas/objectIdInput'
        in: path
        name: id
        required: true
        description: Identifier of the request record whose latest compliance certificate document will be returned.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    description: Unique identifier of the document.
                    allOf:
                    - $ref: '#/components/schemas/objectId'
                  name:
                    type: string
                    description: Human-readable name of the document, derived from its source.
                  processing:
                    nullable: true
                    description: Whether the document is still being processed (data extraction, classification). When `true`, extracted fields may not yet be populated.
                    type: boolean
                  url:
                    description: Signed URL to download the document file. Time-limited; regenerated on each read.
                    nullable: true
                    type: string
                  flag:
