      description: Assign a compliance profile to a request record, scoped to the caller's organization. Assigning a profile attaches its rules and document checklists to the request record and starts compliance evaluation against it. If the request record has a context record and the supplied profile is `Global`, a `Project`-scoped compliance profile is created or reused automatically.
