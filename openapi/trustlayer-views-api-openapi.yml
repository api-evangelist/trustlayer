components:
  schemas:
    objectId:
      title: ObjectId
      type: string
      format: ObjectId
      examples:
      - 507f1f77bcf86cd799439011
    objectIdInput:
      title: ObjectId
      type: string
      format: ObjectId
      examples:
      - 507f1f77bcf86cd799439011
  securitySchemes:
    Token:
      name: Authorization
      type: apiKey
      in: header
      description: ''
