    patch:
      tags:
      - Primary Objects
      description: Partially update a primary object (entity type definition). Any subset of writable fields may be provided; omitted fields are left unchanged. Returns the full updated primary object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Human-readable singular name of the primary object type (e.g. "Vendor").
                pluralName:
                  type: string
                  minLength: 1
                  description: Human-readable plural name of the primary object type (e.g. "Vendors").
                icon:
                  type: string
                  minLength: 1
                  description: Icon identifier shown in the UI for primary records of this type. Defaults to `shop`.
                defaultRequestRecords:
                  type: array
                  items:
                    type: object
                    properties:
                      _id:
                        default: 6a5f7579d3b44b030ef69d2e
                        allOf:
                        - $ref: '#/components/schemas/objectIdInput'
                      name:
                        type: string
                        minLength: 1
                      enabled:
                        default: true
                        type: boolean
                    required:
                    - name
                  description: Templates for request records auto-created when a primary record of this type is created. Defaults to an empty list.
              description: Request body for partially updating a primary object. Any subset of the create-body fields may be provided.
        description: Request body for partially updating a primary object. Any subset of the create-body fields may be provided.
      parameters:
      - schema:
          allOf:
          - $ref: '#/components/schemas/objectIdInput'
        in: path
        name: id
        required: true
        description: Identifier of the primary object to update.
      responses:
        '200':
          description: A primary object — a configurable entity type definition in the workspace (e.g. Vendor, Subcontractor).
          content:
            application/json:
              schema:
                type: object
                properties:
