                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/party'
      tags:
      - compliance-profiles
      description: This will turn off compliance tracking both at the global level and in each of the party's projects.
      x-internal: true
