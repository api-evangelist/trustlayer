  /compliance-profiles/{id}/requirements:
    post:
      tags:
      - compliance-profiles
      description: Add requirements to a compliance profile. Each item is either a library reference (`libraryRequirementId` or `attributeCode`) or a custom definition (module/subject by code or label, attribute by label). Idempotent on the (moduleLabel, subjectLabel, attributeLabel) tuple. The response contains only the requirements newly added by this call; duplicates of existing rules or earlier items in the batch are omitted, so the array is empty when every input was a duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requirements:
                  minItems: 1
                  maxItems: 200
                  type: array
                  items:
                    anyOf:
                    - type: object
                      properties:
                        libraryRequirementId:
                          description: Identifier of the requirement entry in the workspace's requirements library to clone onto this request record.
                          allOf:
                          - $ref: '#/components/schemas/objectIdInput'
                      required:
                      - libraryRequirementId
                      additionalProperties: false
                      description: Reference an existing library requirement by its identifier. The persisted requirement is a verbatim copy (matchingCriteria, operator, targetValue, attributeType, etc.) of the library entry.
                    - type: object
                      properties:
                        attributeCode:
                          type: string
                          minLength: 1
                          description: Stable code of the library requirement to clone (alternative to `libraryRequirementId`). Must match an entry in the workspace requirements library.
                        matchingCriteria:
                          type: string
                          enum:
                          - matchOnce
                          - matchRepeatedly
                          description: How the requirement matches against documents (e.g. `MatchOnce`, `MatchRepeatedly`). Overrides the library entry value.
                        operator:
                          type: string
                          enum:
                          - must be present
                          - must be greater or equal to
                          - must be less than or equal to
                          - must be completed by
                          - at least one must be present from list
                          description: Comparison operator applied between the document data and `targetValue`. Must be valid for the library entry's `attributeType`.
                        targetValue:
                          description: Value(s) the document data is compared against. String for scalar attribute types; string array for `list` attribute types. Optional for operators that do not require a target value (e.g. `MustBePresent`).
                          anyOf:
                          - type: string
                            minLength: 1
                          - type: array
                            items:
                              type: string
                              minLength: 1
                      required:
                      - attributeCode
                      - matchingCriteria
                      - operator
                      additionalProperties: false
                      description: Reference an existing library requirement by its `attributeCode`. The persisted requirement uses the library entry for module/subject/attribute identity but takes `matchingCriteria`, `operator`, and `targetValue` from the input — supports requirement-template entries that may not carry these fields.
                    - oneOf:
                      - allOf:
                        - type: object
                          properties:
                            subjectCode:
                              type: string
                              minLength: 1
                              description: Existing subject code on the compliance profile. When provided, the subject (and its parent module) are reused. Mutually exclusive with `subjectLabel`.
                            moduleCode:
                              description: Existing module code on the compliance profile. When provided, the requirement is anchored to that module. Mutually exclusive with `moduleLabel`.
                              type: string
                              minLength: 1
                            subjectLabel:
                              not: {}
                            moduleLabel:
                              not: {}
                            matchingCriteria:
                              type: string
                              enum:
                              - matchOnce
                              - matchRepeatedly
                              description: How the requirement matches against documents (e.g. `MatchOnce`, `MatchRepeatedly`).
                            attributeCode:
                              not: {}
                          required:
                          - subjectCode
                          - matchingCriteria
                        - type: object
                          properties:
                            attributeCode:
                              type: string
                              minLength: 1
                            attributeLabel:
                              type: string
                              minLength: 1
                            attributeDescription:
                              type: string
                              minLength: 1
