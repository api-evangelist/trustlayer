            schema:
              type: object
              properties:
                contact:
                  $ref: '#/components/schemas/contact-create'
      description: '* `name` is required.

        * setting the `primary` flag to `true` will unset it from the current primary contact.

        '
      x-internal: false
      tags:
      - contacts
    get:
      summary: List a party's contacts
      operationId: get-parties-id-contacts
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/contact'
                  meta:
                    $ref: '#/components/schemas/collection-meta'
      description: Returns all the contacts for a party. Note that pagination is not available, so the meta information will always return the number of contacts in `totalCount` and 1 in `totalPages`.
      tags:
      - contacts
  /contacts:
    get:
      tags:
      - contacts
      description: 'List contacts in the caller''s organization. Results are always scoped to the caller''s organization. Supports filtering, sorting, and pagination via `limit` and `skip`.


        <!-- qs2mongo:list-summary -->


        **Filtering**: `_id` (objectId), `createdAt` (date), `updatedAt` (date), `email` (string), `contactPersonName` (string), `companyName` (string). See "List Endpoints" in the API overview for operator syntax and combining rules.


        **Sorting**: supported via `sort` (see the parameter''s description for allowed fields). Prefix with `-` for descending.


        **Field projection**: supported via `fields` (see the parameter''s description for allowed fields).'
      parameters:
      - schema:
          default: 20
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
        in: query
        name: limit
        required: false
      - schema:
          default: 0
          type: integer
          minimum: 0
          maximum: 9007199254740991
        in: query
        name: skip
        required: false
      - schema:
          type: string
          minLength: 1
        in: query
        name: sort
        required: false
        description: 'Comma-separated list of fields to sort by. Example: ''_id,-createdAt''. Allowed: email, contactPersonName, companyName, createdAt, updatedAt'
      - schema:
          type: string
          minLength: 1
        in: query
        name: fields
        required: false
        description: 'Comma-separated list of fields to project. Allowed: _id, email, contactPersonName, companyName, title, phone, fax, address, createdAt, updatedAt'
      - schema:
          type: string
        in: query
        name: _id
        required: false
        description: Filter by _id. 24-character hex ObjectId string (e.g. `_id=507f1f77bcf86cd799439011`). See "List Endpoints" in the API overview for operator syntax.
      - schema:
          type: string
        in: query
        name: createdAt
        required: false
        description: Filter by createdAt. ISO-8601 date or datetime string (e.g. `createdAt=2024-01-15`). See "List Endpoints" in the API overview for operator syntax.
      - schema:
          type: string
        in: query
        name: updatedAt
        required: false
        description: Filter by updatedAt. ISO-8601 date or datetime string (e.g. `updatedAt=2024-01-15`). See "List Endpoints" in the API overview for operator syntax.
      - schema:
          type: string
        in: query
        name: email
        required: false
        description: Filter by email. String value (e.g. `email=example`). See "List Endpoints" in the API overview for operator syntax.
      - schema:
          type: string
        in: query
        name: contactPersonName
        required: false
        description: Filter by contactPersonName. String value (e.g. `contactPersonName=example`). See "List Endpoints" in the API overview for operator syntax.
      - schema:
          type: string
        in: query
        name: companyName
        required: false
        description: Filter by companyName. String value (e.g. `companyName=example`). See "List Endpoints" in the API overview for operator syntax.
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          description: Unique identifier of the contact.
                          allOf:
                          - $ref: '#/components/schemas/objectId'
                        contactPersonName:
                          description: Full name of the contact person.
                          type: string
                        companyName:
                          description: Company or organization name for this contact.
                          type: string
                        title:
                          description: Job title of the contact person.
                          type: string
                        email:
                          description: Email address of the contact.
                        phone:
                          description: Phone number of the contact.
                          type: string
                        fax:
                          description: Fax number of the contact.
                          type: string
                        address:
                          description: Postal address of the contact. All sub-fields are optional.
                          type: object
                          properties:
                            type:
                              type: string
                            rawAddress:
                              type: string
                            line1:
                              type: string
                            line2:
                              type: string
                            postalCode:
                              type: string
                            city:
                              type: string
                            region:
                              type: string
                            country:
                              type: string
                            latitude:
                              type: number
                            longitude:
                              type: number
                          additionalProperties: false
                        createdAt:
                          description: Timestamp at which the contact was created.
                          type: string
                          format: date-time
                        updatedAt:
                          description: Timestamp at which the contact was last updated.
                          type: string
                          format: date-time
                      required:
                      - _id
                      additionalProperties: false
                  meta:
                    type: object
                    properties:
                      count:
                        type: number
                        description: Total number of records matching the query, across all pages.
                      next:
                        description: Relative URL for the next page of results, preserving filters/sort/projection. Omitted on the last page.
                        type: string
                      prev:
                        description: Relative URL for the previous page of results, preserving filters/sort/projection. Omitted on the first page.
                        type: string
                    required:
                    - count
                    additionalProperties: false
                required:
                - data
                - meta
                additionalProperties: false
        '400':
          description: The request could not be understood — invalid body payload, unknown querystring filter, or a schema validation failure.
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: number
                    enum:
                    - 400
                  applicationCode:
                    type: string
                    description: Machine-readable error code. For application errors this is the ApplicationError.applicationCode (e.g. "FLOW.006"); for schema validation failures it is "FLOW.002" (InvalidData); for unexpected server failures it is "LIB.000".
                  message:
