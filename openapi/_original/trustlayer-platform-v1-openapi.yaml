openapi: 3.0.0
info:
  title: TrustLayer Platform API
  version: '1.0'
  contact:
    name: TrustLayer Support
    email: support@trustlayer.io
  termsOfService: 'https://trustlayer.io/terms-of-service'
  externalDocs:
    description: OpenAPI specification
    url: /v1/platform-api.yaml
  description: |-
    3rd-party API for the TrustLayer platform.

    **Deprecated.** Platform API v1 is deprecated as of 01 June 2026 and is
    scheduled for sunset (end-of-life) on 31 March 2027. It remains fully
    available until the sunset date but will not receive new features. Please
    migrate to Platform API v2 for new integrations.

    All v1 responses carry the standard deprecation response headers
    ([RFC 8594](https://www.rfc-editor.org/rfc/rfc8594)):

    ```http
    Deprecation: @1780272000
    Sunset: Wed, 31 Mar 2027 23:59:59 GMT
    Link: <https://developers.trustlayer.io/>; rel="deprecation", <https://developers.trustlayer.io/>; rel="sunset"
    ```

    `Deprecation: @1780272000` is the Unix timestamp for 2026-06-01T00:00:00Z;
    sunset (end-of-life) is 2027-03-31T23:59:59 GMT.
  x-deprecated: true
  x-deprecation-date: '2026-06-01'
  x-sunset: '2027-03-31'
  license:
    name: Apache 2.0
    url: 'https://apache.org/licenses/LICENSE-2.0'
servers:
  - url: 'http://localhost:4000/v1'
    description: Local
  - url: 'https://api.trustlayer.io/v1'
    description: Production
paths:
  /parties:
    get:
      summary: List parties
      tags:
        - parties
      operationId: get-parties
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page-number'
        - $ref: '#/components/parameters/page-size'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/include'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/party'
                  meta:
                    $ref: '#/components/schemas/collection-meta'
              examples: {}
      description: |
        Available filters:
        * `project`
        * `name`
        * `type`
        * `status`
        * `createdAt`
        * `updatedAt`
        * `customField`
        * `externalId`
        * `active`

        Available sort keys:
        * `name`
        * `createdAt`
        * `updatedAt`
        * `status`

        Available include options:
        * `projects`
        * `documents`
        * `tags`
        * `complianceProfile`
        * `customFields`

        Pagination is enabled.

        Notes:

        * the `type` filter takes either the singular or plural version of the type (e.g. "Vendor", "Vendors")
        * valid values for the `status` filter: "non_compliant", "compliant".
        * valid values for the `active` filter: "true", "false"
        * by default both active and inactive parties are returned
        * when filtering by `project`, the parties compliance data will be relative to the selected project
        * the value of the `externalId` filter must be in the format `<provider name>/<external id>`, e.g. `procore/1234`
        * the value of the `customField` filter must be in the format `<custom field id>;<field value>`. The only supported operator is `eq` (exact match, case-sensitive).
    post:
      summary: Create a new party
      operationId: post-parties
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/party'
      tags:
        - parties
      description: |-
        Note that a placeholder primary contact will be created with the name "Anonymous" if no contact information is provided.

        The compliance profile will be assigned based on the party type.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                party:
                  $ref: '#/components/schemas/party-create'
      x-internal: false
  '/parties/{partyId}':
    get:
      summary: Fetch a party
      tags:
        - parties
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/party'
                required:
                  - status
                  - data
                readOnly: true
      operationId: 'get-parties-:id'
      deprecated: true
      description: |
        Available include options:
        * `projects`
        * `documents`
        * `tags`
        * `complianceProfile`
        * `customFields`

        Available scope options:
        * `projects`

        If `scope[type]=project`, the compliance information in the resulting response will be relative to the selected project.
        If a project scope is specified _and_ documents are included, only documents associated to the project will be returned.
      parameters:
        - $ref: '#/components/parameters/include'
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
    parameters:
      - schema:
          type: string
        name: partyId
        in: path
        required: true
        description: Party ID
    patch:
      summary: Update a party
      operationId: patch-parties-partyId
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/party'
      description: |-
        The compliance profile can be either turned on/off by assigning `true` or `false` to `complianceProfile`, or it can be changed to another global compliance profile.
        Note: if compliance tracking is turned back on (with `{"complianceProfile": true}`), the party will _not_ have a compliance profile assigned.
      tags:
        - parties
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                party:
                  $ref: '#/components/schemas/party-update'
      x-internal: false
    delete:
      summary: Delete a party
      operationId: delete-parties-partyId
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/party'
      description: TBD
      x-internal: false
      tags:
        - parties
  '/contacts/{contactId}':
    parameters:
      - schema:
          type: string
        name: contactId
        in: path
        required: true
    get:
      summary: Fetch a party contact's information
      tags:
        - contacts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/contact'
                required:
                  - status
                  - data
      operationId: get-contacts-id
      deprecated: true
      description: |-
        Available include options:
        * party
      parameters:
        - $ref: '#/components/parameters/include'
    patch:
      summary: Update a party contact's information
      operationId: patch-contacts-id
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/contact'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contact:
                  $ref: '#/components/schemas/contact-update'
      description: |-
        Update a contact with the given data.

        * setting the `primary` flag to `true` will remove it from the other contacts.
        * setting the `primary` flag to `false` on the current primary contact will return a `400` response, since a primary contact must always exist.
        * if given, `name` must be non-blank
      tags:
        - contacts
      parameters: []
      x-internal: false
    delete:
      summary: Remove contact information from a party
      operationId: delete-contacts-id
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/contact'
      description: This will return a `400` response if you try to remove the primary contact.
      tags:
        - contacts
      x-internal: false
  /documents:
    get:
      summary: List documents
      tags:
        - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/document'
                  meta:
                    $ref: '#/components/schemas/collection-meta'
      operationId: get-documents
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page-number'
        - $ref: '#/components/parameters/page-size'
        - $ref: '#/components/parameters/include'
      description: |-
        Available filters:
        * `name`
        * `party`
        * `project`
        * `type`
        * `archived`
        * `reviewed`
        * `createdAt`
        * `updatedAt`
        * `reviewedAt`
        * `archivedAt`
        * `expirationDate`

        Available sort keys:
        * `name`
        * `createdAt`
        * `updatedAt`
        * `archivedAt`
        * `reviewedAt`
        * `expirationDate`

        Available include options:
        * `party`
        * `projects`
        * `reviewedBy`
        * `archivedBy`
        * `types`

        Pagination is enabled.
    post:
      summary: Upload a document
      operationId: post-documents
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                document:
                  type: string
                  format: binary
                documentType:
                  type: string
                  x-stoplight:
                    id: 5m0jog13c31x8
                  description: Document type name or ID
              required:
                - document
        description: File data
      description: |-
        This endpoint accepts a `multipart/form-data` payload containing a single `document` parameter.
        The returned document will be queued for processing.
        Optionally, a `documentType` parameter can be specified, containing either the exact name of an existing document type, or its ID.
      parameters: []
      tags:
        - documents
  '/documents/{documentId}':
    parameters:
      - schema:
          type: string
        name: documentId
        in: path
        required: true
        description: Document ID
    get:
      summary: Fetch a document
      tags:
        - documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      operationId: get-documents-id
      deprecated: true
      description: |
        Available include options:

        * `party`
        * `projects`
        * `types`
        * `archivedBy`
        * `reviewedBy`

        Notes:

        - the uploaded file is accessible via the `url` attribute; the URL will expire in 24 hours.
      parameters:
        - $ref: '#/components/parameters/include'
    patch:
      summary: Update a document
      operationId: patch-documents-documentId
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      tags:
        - documents
      description: |-
        * Updating a document's data will trigger a recalc of the compliance status for all affected parties.
        * You can specify a project scope; the party the document is attached to _must_ belong to the project

        Requirements: the document _must_ belong to a party.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                document:
                  $ref: '#/components/schemas/document-input'
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
      x-internal: false
    delete:
      summary: Delete a document
      operationId: delete-documents-documentId
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: TBD
      tags:
        - documents
  '/documents/{documentId}/review':
    parameters:
      - schema:
          type: string
        name: documentId
        in: path
        required: true
        description: Document ID
    delete:
      summary: Remove the review from a document
      operationId: delete-documents-id-review
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: |-
        Mark the document as not reviewed. This will remove all the information about the current review status of the document.

        Requirements: the document _must_ belong to a party.
      tags:
        - documents
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
    post:
      summary: Review a document
      operationId: put-documents-id-review
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: |-
        Mark the document as reviewed by the given user. If the document has already been reviewed, no change will be made.

        Requirements: the document _must_ belong to a party.
      tags:
        - documents
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
  '/documents/{documentId}/archive':
    parameters:
      - schema:
          type: string
        name: documentId
        in: path
        required: true
        description: Document ID
    delete:
      summary: Un-archive a document
      operationId: delete-documents-id-archive
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: Mark the document as not archived.
      tags:
        - documents
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
    post:
      summary: Archive a document
      operationId: post-documents-id-archive
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: Mark the document as archived.
      tags:
        - documents
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
  '/documents/{documentId}/reprocess':
    parameters:
      - schema:
          type: string
        name: documentId
        in: path
        required: true
        description: Document ID
    post:
      summary: Reprocess a document
      operationId: put-documents-id-review
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: |
        Send the document to the extraction pipeline. The results will overwite the document's current data.
      tags:
        - documents
      parameters: []
  '/documents/{documentId}/flag':
    parameters:
      - schema:
          type: string
        name: documentId
        in: path
        required: true
        description: Document ID
    delete:
      summary: Remove the flag from a document
      operationId: delete-documents-id-flag
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: |-
        Remove the existing flag data from a document (if any).

        If the document belongs to a party, you can specify an additional project `scope` (the party must belong to the project). This will be used to log the event in the activity timeline.

        Requirements: the document _must_ belong to a party.
      tags:
        - documents
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
    post:
      summary: Flag a document or update the existing flag info
      operationId: put-documents-id-flag
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      description: |
        A document can have at most one flag. If a document is already flagged, existing data will be replaced.

        * `addedOn` will default to the current time if left blank
        * `severityLevel` and `user.id` are the only required parameters

        If the document belongs to a party, you can specify an additional project `scope` (the party must belong to the project). This will be used to log the event in the activity timeline.

        Requirements: the document _must_ belong to a party.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                flag:
                  $ref: '#/components/schemas/document-flag-input'
      tags:
        - documents
      parameters:
        - $ref: '#/components/parameters/scope-type'
        - $ref: '#/components/parameters/scope-id'
  /projects:
    get:
      summary: List projects
      tags:
        - projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/project'
                  meta:
                    $ref: '#/components/schemas/collection-meta'
      operationId: get-projects
      deprecated: true
      description: |
        Available filters:
        * `name`
        * `status` ("compliant", "non_compliant", others?)
        * `active`
        * `createdAt`
        * `updatedAt`
        * `startDate`
        * `endDate`
        * `customField`
        * `externalId`
        * `active`


        Available sort keys:
        * `name`
        * `createdAt`
        * `updatedAt`
        * `startDate`
        * `endDate`

        Available include options:
        * `parties`
        * `customFields`

        Notes:

        * the value of the `externalId` filter must be in the format `<provider name>/<external id>`, e.g. `procore/1234`
        * the value of the `customField` filter must be in the format `<custom field id>/<field value>`. The only supported operator is `eq`.
      parameters:
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/page-number'
        - $ref: '#/components/parameters/page-size'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/include'
      x-internal: false
    post:
      summary: Create a new project
      operationId: post-projects
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/project'
      tags:
        - projects
      description: The only required attribute is `name`.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  $ref: '#/components/schemas/project-create'
  '/projects/{projectId}':
    parameters:
      - schema:
          type: string
        name: projectId
        in: path
        required: true
        description: Project ID
    get:
      summary: Fetch a project
      tags:
        - projects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/project'
      operationId: get-projects-id
      deprecated: true
      description: |
        Available include options:
        * `parties`
        * `customFields`
      parameters:
        - $ref: '#/components/parameters/include'
    patch:
      summary: Update a custom field
      operationId: patch-custom-fields
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/custom-field'
      description: |-
        Note

        * required attributes (`name` and `fieldType`) _must_ always be specified
        * at the moment it's not possible to specify custom requirementsand checklists.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project:
                  $ref: '#/components/schemas/project-update'
        description: ''
      tags:
        - custom-fields
      x-internal: false
    delete:
      summary: Delete a project
      operationId: delete-projects-projectId
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/project'
      description: Soft-deletes a project
      tags:
        - projects
      x-internal: false
  '/parties/{partyId}/contacts':
    parameters:
      - schema:
          type: string
        name: partyId
        in: path
        required: true
        description: Party ID
    post:
      summary: Create a party contact
      operationId: post-parties-id-contacts
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/party'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contact:
                  $ref: '#/components/schemas/contact-create'
      description: |
        * `name` is required.
        * setting the `primary` flag to `true` will unset it from the current primary contact.
      x-internal: false
      tags:
        - parties
        - contacts
    get:
      summary: List a party's contacts
      operationId: get-parties-id-contacts
      deprecated: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/contact'
                  meta:
                    $ref: '#/components/schemas/collection-meta'
      description: 'Returns all the contacts for a party. Note that pagination is not available, so the meta information will always return the number of contacts in `totalCount` and 1 in `totalPages`.'
      tags:
        - parties
        - contacts
  '/parties/{partyId}/compliance-certificate':
    parameters:
      - schema:
          type: string
        name: partyId
        in: path
        required: true
        description: Party ID
    post:
      summary: Create a party compliance certificate
      operationId: post-parties-id-compliance-certificate-create
      deprecated: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/response-status'
                  data:
                    $ref: '#/components/schemas/document'
      requestBody:
        content:
