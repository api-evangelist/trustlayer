aid: trustlayer
name: TrustLayer
description: >-
  TrustLayer is a vendor risk management and certificate of insurance (COI)
  tracking platform that automates the collection, verification, and ongoing
  monitoring of compliance documents. It uses AI-powered OCR field extraction,
  real-time carrier connections, and NIPR license verification to process COIs,
  W9s, and business licenses across a network of 500,000+ companies. The
  TrustLayer Platform API lets teams programmatically manage parties (vendors),
  contacts, projects, documents, and compliance profiles, request documents,
  and receive real-time webhook notifications as compliance status changes.
  Backed by Craft Ventures. Sector: insurtech / fintech.
